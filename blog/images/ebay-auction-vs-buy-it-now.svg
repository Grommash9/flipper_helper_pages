<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgAuc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFB"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="460" rx="12" fill="url(#bgAuc)" stroke="#DDE3EC" stroke-width="1"/>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A2E">Auction vs Buy It Now: Which Should You Use?</text>
  <text x="360" y="60" text-anchor="middle" font-size="13" fill="#888">~80% of eBay sales are Buy It Now</text>

  <!-- BUY IT NOW card -->
  <rect x="30" y="80" width="320" height="350" rx="10" fill="#fff" stroke="#334B90" stroke-width="2"/>
  <rect x="30" y="80" width="320" height="44" rx="10" fill="#334B90"/>
  <rect x="30" y="104" width="320" height="20" fill="#334B90"/>
  <text x="190" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Buy It Now (Fixed Price)</text>

  <!-- BIN badge -->
  <rect x="238" y="127" width="100" height="22" rx="11" fill="#334B90" opacity="0.1"/>
  <text x="288" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#334B90">RECOMMENDED</text>

  <!-- BIN details -->
  <text x="55" y="142" font-size="13" font-weight="600" fill="#333">Best for:</text>

  <text x="55" y="172" font-size="13" fill="#555">&#8226; Items with a known value</text>
  <text x="55" y="196" font-size="13" fill="#555">&#8226; Clothing, shoes, accessories</text>
  <text x="55" y="220" font-size="13" fill="#555">&#8226; Electronics with clear pricing</text>
  <text x="55" y="244" font-size="13" fill="#555">&#8226; When you want a set price</text>

  <line x1="50" y1="262" x2="335" y2="262" stroke="#EEF2F7" stroke-width="1"/>

  <text x="55" y="286" font-size="13" font-weight="600" fill="#333">Pros:</text>
  <text x="55" y="308" font-size="13" fill="#27AE60">&#10003; Predictable income</text>
  <text x="55" y="330" font-size="13" fill="#27AE60">&#10003; Buyer purchases instantly</text>
  <text x="55" y="352" font-size="13" fill="#27AE60">&#10003; Enable "Best Offer" to negotiate</text>

  <line x1="50" y1="368" x2="335" y2="368" stroke="#EEF2F7" stroke-width="1"/>

  <text x="55" y="388" font-size="13" font-weight="600" fill="#333">Tip:</text>
  <text x="100" y="388" font-size="12" fill="#555">Check eBay "Sold Items"</text>
  <text x="55" y="404" font-size="12" fill="#555">filter to see real sale prices,</text>
  <text x="55" y="418" font-size="12" fill="#555">not just what people are asking.</text>

  <!-- AUCTION card -->
  <rect x="370" y="80" width="320" height="350" rx="10" fill="#fff" stroke="#F9DDA5" stroke-width="2"/>
  <rect x="370" y="80" width="320" height="44" rx="10" fill="#8B7030"/>
  <rect x="370" y="104" width="320" height="20" fill="#8B7030"/>
  <text x="530" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Auction (7-Day Bidding)</text>

  <!-- Auction badge -->
  <rect x="564" y="127" width="110" height="22" rx="11" fill="#8B7030" opacity="0.1"/>
  <text x="619" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#8B7030">SITUATIONAL</text>

  <!-- Auction details -->
  <text x="395" y="142" font-size="13" font-weight="600" fill="#333">Best for:</text>

  <text x="395" y="172" font-size="13" fill="#555">&#8226; Rare or collectible items</text>
  <text x="395" y="196" font-size="13" fill="#555">&#8226; Items you can't price easily</text>
  <text x="395" y="220" font-size="13" fill="#555">&#8226; Vintage or one-of-a-kind pieces</text>
  <text x="395" y="244" font-size="13" fill="#555">&#8226; When you want a fast sale</text>

  <line x1="390" y1="262" x2="675" y2="262" stroke="#EEF2F7" stroke-width="1"/>

  <text x="395" y="286" font-size="13" font-weight="600" fill="#333">Trade-offs:</text>
  <text x="395" y="308" font-size="13" fill="#C0392B">&#9888; Price can go lower than expected</text>
  <text x="395" y="330" font-size="13" fill="#C0392B">&#9888; Must wait for auction to end</text>
  <text x="395" y="352" font-size="13" fill="#27AE60">&#10003; Demand can push price UP</text>

  <line x1="390" y1="368" x2="675" y2="368" stroke="#EEF2F7" stroke-width="1"/>

  <text x="395" y="388" font-size="13" font-weight="600" fill="#333">Tip:</text>
  <text x="440" y="388" font-size="12" fill="#555">Start at a price you'd</text>
  <text x="395" y="404" font-size="12" fill="#555">accept as the minimum. Never</text>
  <text x="395" y="418" font-size="12" fill="#555">start at 99p unless you'd sell for 99p.</text>

  <!-- Footer -->
  <text x="360" y="452" text-anchor="middle" font-size="11" fill="#AAA">When in doubt, use Buy It Now with Best Offer enabled.</text>
</svg>