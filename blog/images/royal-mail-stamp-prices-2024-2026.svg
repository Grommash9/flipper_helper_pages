<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFB"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="bar1st" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334B90"/>
      <stop offset="100%" stop-color="#2A3D75"/>
    </linearGradient>
    <linearGradient id="bar2nd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F9DDA5"/>
      <stop offset="100%" stop-color="#E8C87A"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#C0392B"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" rx="12" fill="url(#bg)" stroke="#DDE3EC" stroke-width="1"/>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A2E">Royal Mail Stamp Prices: 2024 vs 2025 vs 2026</text>

  <!-- Legend -->
  <rect x="220" y="54" width="14" height="14" rx="3" fill="url(#bar1st)"/>
  <text x="240" y="66" font-size="13" fill="#555">1st Class</text>
  <rect x="330" y="54" width="14" height="14" rx="3" fill="url(#bar2nd)"/>
  <text x="350" y="66" font-size="13" fill="#555">2nd Class</text>

  <!-- Chart area: y=85 to y=370, x=90 to x=660 -->
  <!-- Y axis labels (price in pence) -->
  <text x="80" y="374" text-anchor="end" font-size="12" fill="#888">0p</text>
  <text x="80" y="317" text-anchor="end" font-size="12" fill="#888">50p</text>
  <text x="80" y="260" text-anchor="end" font-size="12" fill="#888">100p</text>
  <text x="80" y="203" text-anchor="end" font-size="12" fill="#888">150p</text>
  <text x="80" y="146" text-anchor="end" font-size="12" fill="#888">200p</text>
  <text x="80" y="89" text-anchor="end" font-size="12" fill="#888">250p</text>

  <!-- Grid lines -->
  <line x1="90" y1="370" x2="660" y2="370" stroke="#DDE3EC" stroke-width="1"/>
  <line x1="90" y1="313" x2="660" y2="313" stroke="#DDE3EC" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="90" y1="256" x2="660" y2="256" stroke="#DDE3EC" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="90" y1="199" x2="660" y2="199" stroke="#DDE3EC" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="90" y1="142" x2="660" y2="142" stroke="#DDE3EC" stroke-width="0.5" stroke-dasharray="4,4"/>
  <line x1="90" y1="85" x2="660" y2="85" stroke="#DDE3EC" stroke-width="0.5" stroke-dasharray="4,4"/>

  <!-- Scale: 0p = y370, 250p = y85. Each penny = (370-85)/250 = 1.14px -->
  <!-- Apr 2024: 1st=135p, 2nd=85p -->
  <!-- Apr 2025: 1st=170p, 2nd=87p -->
  <!-- Apr 2026: 1st=180p, 2nd=91p -->

  <!-- Group: April 2024 (center x=185) -->
  <!-- 1st class: 135p -> height=135*1.14=153.9, y=370-153.9=216.1 -->
  <rect x="140" y="216" width="50" height="154" rx="4" fill="url(#bar1st)"/>
  <text x="165" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#334B90">£1.35</text>
  <!-- 2nd class: 85p -> height=85*1.14=96.9, y=370-96.9=273.1 -->
  <rect x="195" y="273" width="50" height="97" rx="4" fill="url(#bar2nd)"/>
  <text x="220" y="265" text-anchor="middle" font-size="13" font-weight="600" fill="#8B7030">85p</text>
  <!-- Year label -->
  <text x="192" y="395" text-anchor="middle" font-size="14" font-weight="600" fill="#555">Apr 2024</text>

  <!-- Group: April 2025 (center x=375) -->
  <!-- 1st class: 170p -> height=170*1.14=193.8, y=370-193.8=176.2 -->
  <rect x="330" y="176" width="50" height="194" rx="4" fill="url(#bar1st)"/>
  <text x="355" y="168" text-anchor="middle" font-size="13" font-weight="600" fill="#334B90">£1.70</text>
  <!-- 2nd class: 87p -> height=87*1.14=99.18, y=370-99.18=270.8 -->
  <rect x="385" y="271" width="50" height="99" rx="4" fill="url(#bar2nd)"/>
  <text x="410" y="263" text-anchor="middle" font-size="13" font-weight="600" fill="#8B7030">87p</text>
  <!-- Year label -->
  <text x="382" y="395" text-anchor="middle" font-size="14" font-weight="600" fill="#555">Apr 2025</text>

  <!-- Group: April 2026 (center x=565) -->
  <!-- 1st class: 180p -> height=180*1.14=205.2, y=370-205.2=164.8 -->
  <rect x="520" y="165" width="50" height="205" rx="4" fill="url(#bar1st)"/>
  <text x="545" y="157" text-anchor="middle" font-size="13" font-weight="600" fill="#334B90">£1.80</text>
  <!-- 2nd class: 91p -> height=91*1.14=103.74, y=370-103.74=266.3 -->
  <rect x="575" y="266" width="50" height="104" rx="4" fill="url(#bar2nd)"/>
  <text x="600" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#8B7030">91p</text>
  <!-- Year label -->
  <text x="572" y="395" text-anchor="middle" font-size="14" font-weight="600" fill="#555">Apr 2026</text>

  <!-- Increase annotations -->
  <text x="288" y="130" text-anchor="middle" font-size="11" fill="#C0392B" font-weight="600">+26%</text>
  <line x1="165" y1="136" x2="355" y2="136" stroke="#C0392B" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  <text x="478" y="130" text-anchor="middle" font-size="11" fill="#C0392B" font-weight="600">+6%</text>
  <line x1="355" y1="136" x2="545" y2="136" stroke="#C0392B" stroke-width="1" stroke-dasharray="3,3"/>

</svg>